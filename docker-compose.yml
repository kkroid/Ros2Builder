x-proxy-build-args: &proxy-build-args
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  all_proxy: ${ALL_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}

x-proxy-env: &proxy-env
  HTTP_PROXY: ${HTTP_PROXY:-}
  HTTPS_PROXY: ${HTTPS_PROXY:-}
  ALL_PROXY: ${ALL_PROXY:-}
  NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}
  http_proxy: ${HTTP_PROXY:-}
  https_proxy: ${HTTPS_PROXY:-}
  all_proxy: ${ALL_PROXY:-}
  no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal,host.containers.internal}

services:
  android-build:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        <<: *proxy-build-args
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:22.04}
    image: ros2-humble-android-builder:latest
    working_dir: /work
    environment:
      <<: *proxy-env
      ROS_DISTRO: humble
      ANDROID_NDK_HOME: ${ANDROID_NDK_HOME:-/opt/android-ndk-cache/android-ndk-r25b-linux}
      NDK_CACHE_DIR: /opt/android-ndk-cache
      NDK_VERSION: ${NDK_VERSION:-r25b}
      NDK_DOWNLOAD_URL: ${NDK_DOWNLOAD_URL:-https://dl.google.com/android/repository/android-ndk-r25b-linux.zip}
      ANDROID_ABI: ${ANDROID_ABI:-arm64-v8a}
      ANDROID_API: ${ANDROID_API:-29}
      ANDROID_STL: ${ANDROID_STL:-c++_shared}
      BUILD_SHARED_LIBS: ${BUILD_SHARED_LIBS:-ON}
      BUILD_OUTPUT_SUFFIX: ${BUILD_OUTPUT_SUFFIX:-}
      BUILD_PACKAGES: ${BUILD_PACKAGES:-rclcpp rmw_fastrtps_cpp std_msgs}
      CMAKE_POSITION_INDEPENDENT_CODE: ${CMAKE_POSITION_INDEPENDENT_CODE:-}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      RMW_IMPLEMENTATION_DISABLE_RUNTIME_SELECTION: ${RMW_IMPLEMENTATION_DISABLE_RUNTIME_SELECTION:-}
      STATIC_ROSIDL_TYPESUPPORT_C: ${STATIC_ROSIDL_TYPESUPPORT_C:-}
      STATIC_ROSIDL_TYPESUPPORT_CPP: ${STATIC_ROSIDL_TYPESUPPORT_CPP:-}
      SOURCE_MANIFEST: ${SOURCE_MANIFEST:-/manifests/ros2-humble-android.repos}
    volumes:
      - ${ROS2_ANDROID_WORKDIR:-./work}:/work
      - ${NDK_CACHE_DIR:-./ndk}:/opt/android-ndk-cache
      - ./manifests:/manifests:ro
      - ./scripts:/scripts:ro
    command: bash -lc "/scripts/ensure_ndk.sh && /scripts/fetch_sources.sh && /scripts/build_android.sh && /scripts/package_android_artifacts.sh"
