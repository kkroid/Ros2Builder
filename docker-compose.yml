services:
  builder: &builder
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:22.04}
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
        http_proxy: ${HTTP_PROXY:-}
        https_proxy: ${HTTPS_PROXY:-}
        all_proxy: ${ALL_PROXY:-}
        no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
      extra_hosts:
        - host.docker.internal:host-gateway
    image: ros2-humble-android-builder:latest
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /work
    environment:
      ROS_DISTRO: humble
      ANDROID_NDK_HOME: ${ANDROID_NDK_HOME:-/opt/android-ndk-cache/android-ndk-r25b-linux}
      NDK_CACHE_DIR: /opt/android-ndk-cache
      NDK_VERSION: ${NDK_VERSION:-r25b}
      NDK_DOWNLOAD_URL: ${NDK_DOWNLOAD_URL:-https://dl.google.com/android/repository/android-ndk-r25b-linux.zip}
      ANDROID_ABI: ${ANDROID_ABI:-arm64-v8a}
      ANDROID_API: ${ANDROID_API:-29}
      BUILD_SHARED_LIBS: ${BUILD_SHARED_LIBS:-ON}
      BUILD_PACKAGES: ${BUILD_PACKAGES:-rclcpp rmw_fastrtps_cpp std_msgs}
      SOURCE_MANIFEST: ${SOURCE_MANIFEST:-/manifests/ros2-humble-android.repos}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
      http_proxy: ${HTTP_PROXY:-}
      https_proxy: ${HTTPS_PROXY:-}
      all_proxy: ${ALL_PROXY:-}
      no_proxy: ${NO_PROXY:-localhost,127.0.0.1,::1,host.docker.internal}
    volumes:
      - ${ROS2_ANDROID_WORKDIR:-./work}:/work
      - ${NDK_CACHE_DIR:-./ndk}:/opt/android-ndk-cache
      - ./manifests:/manifests:ro
      - ./scripts:/scripts:ro
    command: bash

  prepare-ndk:
    <<: *builder
    command: bash /scripts/ensure_ndk.sh

  fetch-sources:
    <<: *builder
    command: bash /scripts/fetch_sources.sh

  package-artifacts:
    <<: *builder
    command: bash /scripts/package_android_artifacts.sh

  ros2-demo-peer:
    image: ${ROS2_DEMO_IMAGE:-osrf/ros:humble-desktop}
    network_mode: ${ROS2_DEMO_NETWORK_MODE:-host}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ANDROID_STATUS_TOPIC: ${ANDROID_STATUS_TOPIC:-/android/status}
      ANDROID_COMMAND_TOPIC: ${ANDROID_COMMAND_TOPIC:-/android/command}
      ROS2_PEER_COMMANDS: ${ROS2_PEER_COMMANDS:-ping}
      ROS2_PEER_COMMAND_PERIOD: ${ROS2_PEER_COMMAND_PERIOD:-5.0}
      ROS2_PEER_EXIT_AFTER: ${ROS2_PEER_EXIT_AFTER:-0}
      ROS2_PEER_QOS: ${ROS2_PEER_QOS:-best_effort}
    volumes:
      - ./examples/pc-ros2-demo:/demo:ro
    working_dir: /demo
    command: bash /demo/run_peer.sh

  ros2-demo-audio:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2-demo
      args:
        BASE_IMAGE: ${ROS2_DEMO_IMAGE:-osrf/ros:humble-desktop}
    image: ros2-android-demo-audio:latest
    network_mode: ${ROS2_DEMO_NETWORK_MODE:-host}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      ROS2_AUDIO_QOS: ${ROS2_AUDIO_QOS:-reliable}
      PULSE_SERVER: ${PULSE_SERVER:-unix:/mnt/wslg/PulseServer}
      PULSE_SOURCE: ${PULSE_SOURCE:-RDPSource}
    volumes:
      - ./examples/pc-ros2-demo:/demo:ro
      - ${WSLG_DIR:-\\wsl.localhost\Ubuntu-24.04\mnt\wslg}:/mnt/wslg
    working_dir: /demo
    command: bash -lc "source /opt/ros/humble/setup.bash && python3 /demo/record_and_send_audio.py --backend parec --source $${PULSE_SOURCE} --duration $${AUDIO_DURATION:-3}"

  ros2-demo-audio-shell:
    image: ros2-android-demo-audio:latest
    network_mode: ${ROS2_DEMO_NETWORK_MODE:-host}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      PULSE_SERVER: ${PULSE_SERVER:-unix:/mnt/wslg/PulseServer}
      PULSE_SOURCE: ${PULSE_SOURCE:-RDPSource}
    volumes:
      - ./examples/pc-ros2-demo:/demo:ro
      - ${WSLG_DIR:-\\wsl.localhost\Ubuntu-24.04\mnt\wslg}:/mnt/wslg
    working_dir: /demo
    command: bash -lc "source /opt/ros/humble/setup.bash && exec bash"

  ros2-demo-shell:
    image: ${ROS2_DEMO_IMAGE:-osrf/ros:humble-desktop}
    network_mode: ${ROS2_DEMO_NETWORK_MODE:-host}
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
    volumes:
      - ./examples/pc-ros2-demo:/demo:ro
    working_dir: /demo
    command: bash -lc "source /opt/ros/humble/setup.bash && exec bash"